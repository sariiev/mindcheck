services:
  postgres:
    image: postgres:17
    container_name: mindcheck-postgres
    environment:
      POSTGRES_DB: mindcheck
      POSTGRES_USER: mindcheck
      POSTGRES_PASSWORD: mindcheck
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma:1.5.0
    container_name: mindcheck-chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma:/chroma/chroma